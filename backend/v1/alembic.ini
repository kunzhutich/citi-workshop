# Alembic configuration.
#
# There is deliberately no `sqlalchemy.url` here. The connection details are
# injected as environment variables by infra/locals.tf and assembled by
# app.config.Settings, so alembic/env.py reads them from there. Putting a URL
# in this file would mean a second, divergent source of truth — and a password
# in version control.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
