name: Security Check - Python

on: [pull_request, push]

jobs:
  bandit:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      # security-events: write

    steps:
      - name: Setup GitHub Actions
        uses: actions/checkout@master

      - name: Install Python
        uses: actions/setup-python@master
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip3 install bandit

      # --ini .bandit excludes the local virtualenv and the pytest suite; see
      # .bandit at the repository root. Application code is scanned in full.
      - name: Run Bandit
        run: bandit --ini .bandit -r ./backend
